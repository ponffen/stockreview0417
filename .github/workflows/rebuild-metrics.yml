name: Rebuild All Metrics

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入 yes 确认全量重算'
        required: true
        default: 'yes'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run rebuild-all-metrics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/rebuild-all-metrics.js
